/* 타임라인 접기 — 그래프 띠 전체가 여는 버튼이다 (details, JS 없이 동작).
   같은 컴포넌트를 요약 상세와 검색 결과 양쪽에 쓴다 — 스타일 갈림 방지(2026-09-07 오너). */
.tlbox{margin:24px 0 0}
.tlstrip{display:block;cursor:pointer;list-style:none;background:var(--surface);
border:1px solid var(--line);border-radius:14px;padding:15px 18px 11px;box-shadow:var(--shadow)}
.tlstrip::-webkit-details-marker{display:none}
.tlstrip:hover{border-color:var(--accent)}
.tshead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
font-size:12.5px;color:var(--muted)}
.tshead b{font-size:15.5px;color:var(--ink);font-weight:750;letter-spacing:-.01em}
.tshead span{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
.tsbars{display:flex;align-items:flex-end;gap:2px;height:34px;margin:11px 0 7px}
.tsb{flex:1;min-width:2px;background:var(--line);border-radius:2px;transition:opacity .12s}
.tsb.on{background:var(--accent);opacity:.4}
.tsb.peak{background:var(--accent);opacity:1}
.tlstrip:hover .tsb.on{opacity:.6}
.tstrip-foot,.tsfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;
font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;color:var(--muted);
font-variant-numeric:tabular-nums}
.tspill{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);
border-radius:999px;padding:7px 17px;font-family:"Pretendard Variable","Pretendard",
-apple-system,sans-serif;font-size:14px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.tlbox[open] .tspill{background:var(--surface);color:var(--accent-deep)}
.tlstrip:hover .tspill{filter:brightness(1.05)}
@media(max-width:520px){.tsbars{height:26px}.tshead b{font-size:14px}
.tsfoot .tsl,.tsfoot .tsr{display:none}}

.bonehint{display:none}

.bonebox{margin-top:26px}

border-radius:999px;padding:1px 7px}

font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:10.5px;color:var(--muted)}
.rib{position:absolute;width:190px}
.rib .stem{position:absolute;left:12px;width:2px;background:var(--line)}
.rib.flip .stem{left:auto;right:12px}  /* 오른쪽 끝 카드는 왼쪽으로 펼치고 줄기는 시간 좌표 쪽에 */
.rib.up{bottom:50%}
.rib.up .stem{bottom:0;height:46px}
.rib.dn{top:50%}

<script>(function(){
  var MAX_RIBS=28, MIN_IMP=3, DAY_PX=78, CARD_LIMIT=60;
  var CHO='\u3131\u3132\u3134\u3137\u3138\u3139\u3141\u3142\u3143\u3145\u3146\u3147\u3148\u3149\u314a\u314b\u314c\u314d\u314e';
  function norm(s){return String(s).normalize('NFC').toLowerCase().replace(/[\s\-_\u00b7\/]+/g,'');}
  function toCho(s){var o='';for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);
    o+=(c>=0xAC00&&c<=0xD7A3)?CHO[Math.floor((c-0xAC00)/588)]:s[i];}return o;}
  function isCho(q){return /^[\u3131-\u314e]+$/.test(q);}
  function esc(t){return String(t).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function hl(t,kw){var e=esc(t);
    if(!kw) return e;
    try{return e.replace(new RegExp('('+kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');}
    catch(err){return e;}}
  function dk(iso){return iso.slice(5).replace('-','/');}
  function addD(iso,n){var d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);
    return d.toISOString().slice(0,10);}
  function cid(c){return 'c-'+c.s+'-'+norm(c.t).replace(/[^0-9a-z가-힣]+/g,'').slice(0,24);}

  function search(CARDS,kw){
    var q=norm(kw), cho=isCho(q), out=[];
    for(var i=0;i<CARDS.length;i++){
      var c=CARDS[i];
      if(!c._h) c._h=norm(c.t+' '+c.m+' '+(c.x||[]).join(' '));
      if(c._h.indexOf(q)>-1){out.push(c);continue;}
      if(cho){ if(!c._c) c._c=toCho(c._h); if(c._c.indexOf(q)>-1) out.push(c); }
    }
    out.sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:(a.s<b.s?-1:1);});
    return out;
  }

  function dayList(hits){
    var out=[], d=hits[0].d, last=hits[hits.length-1].d;
    while(d<=last){out.push(d); d=addD(d,1);}
    return out;
  }

  function strip(hits,kw){
    var ds=dayList(hits), per={};
    hits.forEach(function(h){per[h.d]=(per[h.d]||0)+1;});
    var mx=0; ds.forEach(function(x){if((per[x]||0)>mx) mx=per[x];});
    var peak=0; ds.forEach(function(x,i){if((per[x]||0)===mx&&!peak) peak=i;});
    var bars=ds.map(function(x,i){
      var c=per[x]||0, h=Math.max(2,Math.round(c/(mx||1)*100));
      var cls=(i===peak&&c)?'tsb peak':(c?'tsb on':'tsb');
      return '<i class="'+cls+'" style="height:'+h+'%" title="'+dk(x)+' \u00b7 '+c+'건"></i>';
    }).join('');
    return '<summary class="tlstrip"><div class="tshead"><b>'+esc(kw)+'</b>'
      +'<span>'+hits.length+'개 주제 \u00b7 '+dk(ds[0])+' ~ '+dk(ds[ds.length-1])+' \u00b7 '+ds.length+'일</span></div>'
      +'<div class="tsbars">'+bars+'</div>'
      +'<div class="tsfoot"><span class="tsl">'+dk(ds[0])+'</span>'
      +'<span class="tspill" id="pill">타임라인 접기</span>'
      +'<span class="tsr">'+dk(ds[ds.length-1])+'</span></div></summary>';
  }

  function bone(hits){
    var ds=dayList(hits), per={};
    hits.forEach(function(h){per[h.d]=(per[h.d]||0)+1;});
    var dens=ds.map(function(x){return [dk(x),per[x]||0];});
    if(dens.length<2) dens=[[dk(addD(hits[0].d,-1)),0]].concat(dens,[[dk(addD(hits[hits.length-1].d,1)),0]]);
    var n=dens.length, mx=0;
    dens.forEach(function(p){if(p[1]>mx) mx=p[1];});
    var cut=Math.max(2,mx*0.75), step=Math.max(1,Math.floor(n/6));
    var boneW=Math.max(880,n*DAY_PX), CW=190/boneW*100+1.5;
    var bars=[],labels=[],peaks=[];
    for(var i=0;i<n;i++){
      var left=2+(i/(n-1))*94, cnt=dens[i][1], h=Math.max(6,Math.round(cnt/(mx||1)*58));
      var isPk=cnt>=cut&&cnt>0;
      bars.push('<div class="bar'+(isPk?' peak':'')+'" style="left:'+left.toFixed(1)+'%;height:'+h+'px"></div>');
      if(isPk&&!peaks.some(function(p){return Math.abs(left-p)<8;})){
        peaks.push(left);
        labels.push('<div class="peaktag" style="left:'+left.toFixed(1)+'%;bottom:calc(50% + '+(h+8)+'px)">'
          +dens[i][0]+' \u00b7 '+cnt+'건</div>');
      }
      if(i%step===0||i===n-1)
        labels.push('<div class="lbl" style="left:'+left.toFixed(1)+'%">'+dens[i][0]+'</div>');
    }
    var ranked=hits.slice().sort(function(a,b){return b.i-a.i||(a.d<b.d?-1:1);});
    var keep=ranked.filter(function(h){return h.i>=MIN_IMP;}).slice(0,MAX_RIBS);
    if(!keep.length) keep=ranked.slice(0,MAX_RIBS);
    var top={}; keep.forEach(function(h){top[cid(h)]=1;});
    var idx={}; dens.forEach(function(p,i){idx[p[0]]=i;});
    var rows=hits.filter(function(h){return top[cid(h)];}).map(function(h){
      var i=idx[dk(h.d)], x=(i===undefined)?50:2+(i/(n-1))*94;
      x=Math.min(Math.max(x,2),97);
      var cap=100-CW-1, flip=x>cap;
      return {left:Math.min(Math.max(flip?x-CW:x,2),cap), flip:flip, h:h};
    }).sort(function(a,b){return a.left-b.left;});
    var LVL=92, STEM=46, lanes={}, cnts={up:0,dn:0}, ribs=[], maxLvl=0;
    rows.forEach(function(r){
      var lvl=0, spot=null;
      while(!spot){
        var sides=cnts.up<=cnts.dn?['up','dn']:['dn','up'];
        for(var s=0;s<2;s++){
          var last=lanes[sides[s]+'|'+lvl];
          if(last===undefined||r.left-last>=CW){spot=[sides[s],lvl];break;}
        }
        if(!spot) lvl++;
      }
      var side=spot[0], lv=spot[1];
      lanes[side+'|'+lv]=r.left; cnts[side]++; maxLvl=Math.max(maxLvl,lv);
      var off=STEM+lv*LVL;
      ribs.push('<div class="rib '+side+(r.flip?' flip':'')+'" style="left:'+r.left.toFixed(1)+'%">'
        +'<div class="stem" style="height:'+off+'px"></div>'
        +'<div class="ribcard i'+r.h.i+'" data-goto="'+esc(cid(r.h))+'" role="button" tabindex="0" style="'
        +(side==='up'?'margin-bottom:':'margin-top:')+off+'px">'
        +'<div class="t">'+dk(r.h.d)+'</div><h3>'+esc(r.h.t)+'</h3></div></div>');
    });
    var half=Math.max(170,STEM+maxLvl*LVL+120);
    return '<div class="bonewrap"><p class="bonehint"><b>\u2192</b> 옆으로 밀어 흐름 보기</p>'
      +'<div class="bonebox"><div class="bone" style="height:'+(half*2)+'px;min-width:'+boneW+'px">'
      +'<div class="spine"></div>'+bars.join('')+labels.join('')+ribs.join('')+'</div></div></div>';
  }

  function cards(hits,kw,slots){
    var sorted=hits.slice().sort(function(a,b){return b.i-a.i||(a.d<b.d?-1:1);});
    var shown=sorted.slice(0,CARD_LIMIT);
    var html=shown.map(function(c){
      var det=(c.x||[]).map(function(x){return '<li>'+hl(x,kw)+'</li>';}).join('');
      var link=c.l?'<li><a href="'+esc(c.l)+'">'+esc(c.l)+'</a></li>':'';
      var back=(slots&&slots[c.s])?'<li><a href="'+esc(slots[c.s].u)+'">이 대화 전체 요약 보기 \u2192 '+esc(c.s)+'</a></li>':'';
      return '<article class="dcard" id="'+esc(cid(c))+'"><div class="t">'+esc(c.d)+' '+esc(c.r)+'</div>'
        +'<h2>'+hl(c.t,kw)+'</h2><p class="sum">'+hl(c.m,kw)+'</p>'
        +'<ul>'+det+link+back+'</ul></article>';
    }).join('');
    var more=sorted.length>CARD_LIMIT
      ? '<p class="findmore">중요도 낮은 '+(sorted.length-CARD_LIMIT)+'장은 접었습니다.</p>' : '';
    return '<section class="details">'+html+'</section>'+more;
  }

  function wire(){
    var box=document.querySelector('.bonebox');
    if(box){
      box.addEventListener('click',function(e){
        var c=e.target.closest('.ribcard[data-goto]'); if(c) jump(c);});
      box.addEventListener('keydown',function(e){
        if(e.key!=='Enter'&&e.key!==' ') return;
        var c=e.target.closest('.ribcard[data-goto]'); if(c){e.preventDefault();jump(c);}});
    }
    function jump(el){
      var t=document.getElementById(el.getAttribute('data-goto'));
      if(!t) return;
      t.scrollIntoView({behavior:'smooth',block:'start'});
      t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash');
    }
    var box2=document.querySelector('.tlbox'), pill=document.getElementById('pill');
    if(box2&&pill) box2.addEventListener('toggle',function(){
      pill.textContent=box2.open?'타임라인 접기':'타임라인 보기';});
  }

  var kw=(new URLSearchParams(location.search).get('q')||'').trim();
  var host=document.getElementById('findview'), head=document.getElementById('findhead');
  var input=document.getElementById('q2');
  if(input){
    input.value=kw;
    input.form.addEventListener('submit',function(e){
      e.preventDefault();
      var v=input.value.trim();
      if(v) location.search='?q='+encodeURIComponent(v);
    });
  }
  if(!kw){host.innerHTML='<p class="empty">검색어가 없습니다. 위에 키워드를 넣어보세요.</p>';return;}
  head.textContent='"'+kw+'" 가 나온 대화 흐름';
  document.title='"'+kw+'" 검색 — 클코단 아카이브';
  fetch('data/cards.json').then(function(r){return r.json();}).then(function(d){
    var hits=search(d.c,kw);
    if(!hits.length){
      host.innerHTML='<p class="empty">"'+esc(kw)+'"가 나온 대화가 없습니다. 다른 말로 찾아보세요.</p>';
      return;
    }
    host.innerHTML='<details class="tlbox" open>'+strip(hits,kw)+bone(hits)+'</details>'
      +cards(hits,kw,d.s);
    wire();
  }).catch(function(){
    host.innerHTML='<p class="empty">검색 데이터를 불러오지 못했습니다.</p>';
  });
})();</script>
</body>
