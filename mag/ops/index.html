<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>배포·운영 — 클코단 매거진</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-STD1JBGG3R"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag("js",new Date());gtag("config","G-STD1JBGG3R");</script>
<style>:root{--ground:#F7F5EF;--surface:#FFFFFF;--line:#E3DECF;--ink:#201C13;--muted:#6B6152;--accent:#F5C400;--on-accent:#201C13;--accent-deep:#7A6200;--shadow:0 1px 2px rgba(32,28,19,.05),0 6px 18px rgba(32,28,19,.06);--chip-bg:#F2EBD4;}
@media (prefers-color-scheme: dark){:root{--ground:#17140F;--surface:#211C13;--line:#37301F;--ink:#EFE8D8;--muted:#ADA189;--accent:#FBDA30;--on-accent:#201C13;--accent-deep:#FBDA30;--shadow:0 1px 2px rgba(0,0,0,.5),0 8px 22px rgba(0,0,0,.35);--chip-bg:#2C2617;}}
:root[data-theme="dark"]{--ground:#17140F;--surface:#211C13;--line:#37301F;--ink:#EFE8D8;--muted:#ADA189;--accent:#FBDA30;--on-accent:#201C13;--accent-deep:#FBDA30;--shadow:0 1px 2px rgba(0,0,0,.5),0 8px 22px rgba(0,0,0,.35);--chip-bg:#2C2617;}
:root[data-theme="light"]{--ground:#F7F5EF;--surface:#FFFFFF;--line:#E3DECF;--ink:#201C13;--muted:#6B6152;--accent:#F5C400;--on-accent:#201C13;--accent-deep:#7A6200;--shadow:0 1px 2px rgba(32,28,19,.05),0 6px 18px rgba(32,28,19,.06);--chip-bg:#F2EBD4;}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
font-family:"Pretendard Variable","Pretendard",-apple-system,"Apple SD Gothic Neo",
"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
font-size:17px;line-height:1.7;word-break:keep-all;overflow-wrap:break-word;
-webkit-text-size-adjust:100%}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(min-width:760px){body{font-size:18px}}

/* mono는 한글이 섞이지 않는 곳에만 — mono 폰트에 한글이 없어 서체가 섞이면 지저분해진다 */
.wrap{max-width:900px;margin:0 auto;padding:28px 20px 88px}
@media(min-width:600px){.wrap{padding:44px 24px 88px}}
header .mark{display:inline-block;background:var(--accent);color:var(--on-accent);font-weight:800;
font-size:13px;padding:5px 11px;border-radius:5px;margin-bottom:12px}
h1{font-size:clamp(27px,6vw,34px);font-weight:800;margin:0 0 8px;letter-spacing:-.02em;line-height:1.3}
.sub{font-size:16px;color:var(--muted);margin:0;max-width:52ch;line-height:1.7}

.hero{margin:24px 0 8px;padding:18px 20px;background:var(--surface);
border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);position:relative}
.hero .fresh{font-size:13px;font-weight:700;color:var(--accent-deep);letter-spacing:.01em}
.hero h2{margin:6px 0 8px;font-size:20px;font-weight:800;line-height:1.45;letter-spacing:-.01em}
.hero h2 a{color:var(--ink);text-decoration:none}
.hero h2 a::after{content:"";position:absolute;inset:0}
.hero .hmeta{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}

.find{margin:20px 0 8px}
.find input{width:100%;font-size:17px;padding:13px 15px;min-height:48px;
border:1px solid var(--line);border-radius:10px;background:var(--surface);
color:var(--ink);font-family:inherit}
.find input::placeholder{color:var(--muted)}
.findhint{font-size:13px;color:var(--muted);margin:7px 2px 0}

.dategroup{margin-top:28px}
.dategroup>h2{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:15px;font-weight:800;
color:var(--accent-deep);letter-spacing:.06em;margin:0 0 2px}
.entry{display:block;padding:16px 4px;border-top:1px solid var(--line);position:relative}
.entry:last-child{border-bottom:1px solid var(--line)}
.slot{display:inline-block;font-family:ui-monospace,"SF Mono",Menlo,monospace;
font-weight:800;font-size:14px;color:var(--accent-deep);margin-bottom:4px}
@media(min-width:600px){
  .entry{display:grid;grid-template-columns:56px 1fr;gap:16px}
  .slot{margin:0;padding-top:4px;font-size:15px;color:var(--ink)}
}
.entry h3{margin:0 0 4px;font-size:18px;font-weight:750;letter-spacing:-.01em;line-height:1.45}
@media(min-width:600px){.entry h3{font-size:19px}}
.entry h3 a{color:var(--ink);text-decoration:none}
.entry h3 a::after{content:"";position:absolute;inset:0}
.entry h3 a:hover{text-decoration:underline;text-decoration-color:var(--accent);
text-decoration-thickness:2px;text-underline-offset:3px}
.emeta{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums;
margin-bottom:8px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:6px;position:relative;z-index:1}
.chip{font-size:13px;font-weight:600;color:var(--muted);background:var(--chip-bg);
border-radius:4px;padding:3px 8px;letter-spacing:.01em;line-height:1.45}

.months{margin-top:34px;padding-top:18px;border-top:1px solid var(--line)}
.months h2{font-size:15px;font-weight:800;margin:0 0 10px;color:var(--muted)}
.months a{display:inline-block;font-size:14px;font-weight:700;color:var(--accent-deep);
text-decoration:none;border:1px solid var(--line);border-radius:8px;
padding:7px 13px;margin:0 6px 6px 0}
.empty{padding:26px 4px;color:var(--muted);font-size:15px}
.tabs{display:flex;gap:6px;margin:18px 0 4px}
.tabs a{font-size:14px;font-weight:700;color:var(--muted);text-decoration:none;
padding:8px 14px;border-radius:8px;border:1px solid var(--line)}
.tabs a.on{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}
/* 레포 카드는 대화 카드의 grid(56px 1fr)를 물려받지 않는다 — slot이 없어 좁은 컬럼에 갇힌다 */
.entry.repo{display:block;padding:18px 4px}
.entry.repo>div{min-width:0}
.entry.repo h3{word-break:normal;overflow-wrap:anywhere}
/* 레포 카탈로그도 대화 요약과 같은 900px 폭 — 그 안에서 카드를 2~3열로 */
.repogrid{display:grid;grid-template-columns:1fr;gap:0}
@media(min-width:680px){
  .repogrid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .repogrid .entry.repo{border:1px solid var(--line);border-radius:12px;
    padding:18px 20px;box-shadow:var(--shadow)}
}
.repo .rmeta{font-size:13px;color:var(--muted);margin:2px 0 8px}
.ghbtn{position:relative;z-index:1;display:inline-block;margin-top:6px;font-size:12.5px;
font-weight:700;color:var(--accent-deep);text-decoration:none;border:1px solid var(--line);
border-radius:8px;padding:5px 11px;background:var(--surface)}
.ghbtn:hover{border-color:var(--accent)}
@media(min-width:760px){
  .sub{font-size:17px}
  .entry h3{font-size:20px}
  .emeta,.rmeta,.findhint{font-size:14.5px}
  .chip{font-size:13.5px}
  .repo ul{font-size:14.5px}
  footer{font-size:14px}
  .find input{font-size:17px}
  .tabs a{font-size:15px}
}
.repo .rlang{display:inline-block;font-size:12px;font-weight:700;color:var(--accent-deep);
background:var(--chip-bg);border-radius:4px;padding:2px 8px;margin-right:6px}
.repo .rstar{display:inline-block;font-size:12px;font-weight:700;color:var(--accent-deep);
margin-right:6px;font-variant-numeric:tabular-nums}
.repo ul{margin:8px 0 0;padding-left:17px;font-size:13.5px;color:var(--muted)}
.repo li{margin-bottom:5px}
.repo .gh{font-size:13px;font-weight:700;color:var(--accent-deep);text-decoration:none}
footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);
font-size:13px;color:var(--muted);max-width:60ch;line-height:1.7}

.wkstat{margin-top:30px}
.wkstat h2{font-size:15px;font-weight:800;color:var(--muted);margin:22px 0 10px}
.days{display:flex;align-items:flex-end;gap:8px;height:100px;padding:0 2px}
.daycol{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1}
.daybar{width:100%;max-width:44px;background:var(--accent);border-radius:3px 3px 0 0}
.daylbl{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--muted)}
.catrow{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.catname{font-size:13.5px;min-width:110px;color:var(--ink)}
.catbar{height:9px;background:var(--accent);border-radius:5px;opacity:.85}
.catnum{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted)}
.wkbanner{display:block;margin:18px 0 4px;padding:13px 16px;background:var(--surface);
border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);
font-size:15px;font-weight:700;box-shadow:var(--shadow)}
.wkbanner span{color:var(--accent-deep)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <span class="mark">클코단 매거진</span>
  <h1>배포·운영</h1>
  <p class="sub">이 주제로 방에서 오간 논의를 정리한 기사 0건.</p>
</header>
<nav class="tabs"><a href="../../">대화 요약</a><a href="../../repos/">공유된 레포</a><a href="../../weekly/">주간 정리</a><a class="on" href="../../mag/">매거진</a></nav>
<div id="browse"><section class="dategroup"><p class="empty">아직 기사가 없어요.</p></section>
<div class="months"><h2>주제별 보기</h2><a href="../tools/">도구·라이브러리 1</a></div></div>
<footer><a href="../">매거진 전체</a> · <a href="../../">대화 아카이브</a></footer>
</div>
</body>
</html>
