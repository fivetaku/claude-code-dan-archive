<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자료·링크 공유 — 클코단 매거진</title>
<style>:root{--ground:#F7F5EF;--surface:#FFFFFF;--line:#E3DECF;--ink:#201C13;--muted:#6B6152;--accent:#F5C400;--on-accent:#201C13;--accent-deep:#7A6200;--shadow:0 1px 2px rgba(32,28,19,.05),0 6px 18px rgba(32,28,19,.06);--chip-bg:#F2EBD4;}
@media (prefers-color-scheme: dark){:root{--ground:#17140F;--surface:#211C13;--line:#37301F;--ink:#EFE8D8;--muted:#ADA189;--accent:#FBDA30;--on-accent:#201C13;--accent-deep:#FBDA30;--shadow:0 1px 2px rgba(0,0,0,.5),0 8px 22px rgba(0,0,0,.35);--chip-bg:#2C2617;}}
:root[data-theme="dark"]{--ground:#17140F;--surface:#211C13;--line:#37301F;--ink:#EFE8D8;--muted:#ADA189;--accent:#FBDA30;--on-accent:#201C13;--accent-deep:#FBDA30;--shadow:0 1px 2px rgba(0,0,0,.5),0 8px 22px rgba(0,0,0,.35);--chip-bg:#2C2617;}
:root[data-theme="light"]{--ground:#F7F5EF;--surface:#FFFFFF;--line:#E3DECF;--ink:#201C13;--muted:#6B6152;--accent:#F5C400;--on-accent:#201C13;--accent-deep:#7A6200;--shadow:0 1px 2px rgba(32,28,19,.05),0 6px 18px rgba(32,28,19,.06);--chip-bg:#F2EBD4;}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
font-family:"Pretendard Variable","Pretendard",-apple-system,"Apple SD Gothic Neo",
"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
font-size:17px;line-height:1.7;word-break:keep-all;overflow-wrap:break-word;
-webkit-text-size-adjust:100%}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(min-width:760px){body{font-size:18px}}

.magnav{display:flex;flex-wrap:wrap;gap:14px;padding:10px 0 14px;border-bottom:2px solid var(--ink);margin-bottom:22px}
.magnav a{font-size:13.5px;font-weight:800;color:var(--ink);text-decoration:none;letter-spacing:-.01em}
.magnav a:hover,.magnav a.on{color:var(--accent-deep)}
.magnav .brand{font-weight:900;margin-right:6px}
.lede{border-bottom:1px solid var(--line);padding-bottom:26px;margin-bottom:26px}
.lede .cat,.card .cat{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;
color:var(--on-accent);background:var(--accent);padding:3px 8px;border-radius:3px;margin-bottom:10px}
.lede h2{font-size:clamp(26px,5.2vw,40px);line-height:1.22;margin:6px 0 10px;letter-spacing:-.02em}
.lede h2 a,.card h3 a{color:var(--ink);text-decoration:none}
.lede h2 a:hover,.card h3 a:hover{color:var(--accent-deep)}
.lede .dek{font-size:16px;color:var(--muted);line-height:1.6}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px 26px}
.card{border-top:1px solid var(--line);padding-top:14px}
.card h3{font-size:17.5px;line-height:1.35;margin:6px 0 8px;letter-spacing:-.01em}
.card .dek{font-size:13.5px;color:var(--muted);line-height:1.55}
.meta{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--muted);margin-top:8px}
.article{max-width:720px}
.article h1{font-size:clamp(24px,5vw,36px);line-height:1.25;letter-spacing:-.02em;margin:10px 0 12px}
.article .dek{font-size:17px;color:var(--muted);line-height:1.6;margin-bottom:18px}
.article h2{font-size:19px;margin:26px 0 10px;letter-spacing:-.01em}
.article p{font-size:16px;line-height:1.75;margin:12px 0}
.article ul{margin:12px 0 12px 18px}.article li{font-size:16px;line-height:1.7;margin:5px 0}
.faq{margin-top:34px;border-top:1px solid var(--line);padding-top:20px}
.faq h2{font-size:18px;margin-bottom:12px}
.faq details{border-bottom:1px solid var(--line);padding:11px 0}
.faq summary{font-size:15.5px;font-weight:700;cursor:pointer;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary::before{content:"Q  ";color:var(--accent-deep);font-family:ui-monospace,Menlo,monospace}
.faq p{font-size:15px;color:var(--muted);margin:9px 0 2px;padding-left:20px}
.tags{margin-top:26px;display:flex;flex-wrap:wrap;gap:7px}
.tags span{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.src{margin-top:26px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:9px;font-size:13.5px;color:var(--muted)}
.src a{color:var(--accent-deep)}
.magfoot{margin-top:44px;border-top:2px solid var(--ink);padding-top:18px;font-size:13px;color:var(--muted);line-height:1.9}
.magfoot .cols{display:flex;flex-wrap:wrap;gap:28px;margin-bottom:14px}
.magfoot a{color:var(--ink);text-decoration:none}.magfoot a:hover{color:var(--accent-deep)}
</style>
</head>
