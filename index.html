<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>클코단 아카이브</title>
<style>
:root{
  --ground:#F7F5EF; --surface:#FFFFFF; --line:#E3DECF; --ink:#201C13; --muted:#847A66;
  --accent:#F5C400; --on-accent:#201C13; --accent-deep:#7A6200;
  --shadow:0 1px 2px rgba(32,28,19,.05),0 6px 18px rgba(32,28,19,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --ground:#17140F; --surface:#211C13; --line:#37301F; --ink:#EFE8D8; --muted:#A2977F;
    --accent:#FBDA30; --on-accent:#201C13; --accent-deep:#FBDA30;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 22px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#17140F; --surface:#211C13; --line:#37301F; --ink:#EFE8D8; --muted:#A2977F;
  --accent:#FBDA30; --on-accent:#201C13; --accent-deep:#FBDA30;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 22px rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  --ground:#F7F5EF; --surface:#FFFFFF; --line:#E3DECF; --ink:#201C13; --muted:#847A66;
  --accent:#F5C400; --on-accent:#201C13; --accent-deep:#7A6200;
  --shadow:0 1px 2px rgba(32,28,19,.05),0 6px 18px rgba(32,28,19,.06);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  line-height:1.65;
}
.mono{font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:740px;margin:0 auto;padding:48px 24px 88px}

header .mark{
  display:inline-block;background:var(--accent);color:var(--on-accent);
  font-weight:800;font-size:12.5px;padding:5px 11px;border-radius:5px;letter-spacing:.02em;
  margin-bottom:14px;
}
h1{font-size:clamp(24px,4.5vw,34px);font-weight:800;margin:0 0 10px;letter-spacing:-.03em}
.sub{font-size:14px;color:var(--muted);margin:0;max-width:56ch}

.stats{
  display:flex;flex-wrap:wrap;gap:0;margin:30px 0 38px;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  box-shadow:var(--shadow);overflow:hidden;
}
.stats>div{flex:1;min-width:120px;padding:14px 18px;border-right:1px solid var(--line)}
.stats>div:last-child{border-right:none}
.stats .n{
  font-family:ui-monospace,"SF Mono",Menlo,monospace;
  font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;
}
.stats .l{font-size:11.5px;color:var(--muted);letter-spacing:.04em}

.feed{display:flex;flex-direction:column}
.entry{
  display:grid;grid-template-columns:84px 1fr;gap:18px;
  padding:20px 4px;border-top:1px solid var(--line);
}
.entry:last-child{border-bottom:1px solid var(--line)}
.datebox{padding-top:3px}
.datebox .d{
  font-family:ui-monospace,"SF Mono",Menlo,monospace;
  font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;
}
.datebox .y{
  font-family:ui-monospace,"SF Mono",Menlo,monospace;
  font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;
}
.entry h2{margin:0 0 3px;font-size:17px;font-weight:750;letter-spacing:-.015em}
.entry h2 a{color:var(--ink);text-decoration:none}
.entry h2 a:hover{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px}
.emeta{
  font-family:ui-monospace,"SF Mono",Menlo,monospace;
  font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:10px;
}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font-size:11.5px;font-weight:600;color:var(--muted);
  border:1px solid var(--line);background:var(--surface);
  padding:2px 10px;border-radius:999px;
}
.open{
  display:inline-block;margin-top:12px;font-size:12.5px;font-weight:700;
  color:var(--accent-deep);text-decoration:none;
  border-bottom:2px solid var(--accent);padding-bottom:1px;
}
footer{margin-top:52px;font-size:12px;color:var(--muted);max-width:60ch}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>

</body>
</html>
